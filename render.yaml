services:
  - type: web
    name: mlb-betting-model-reflex
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ping/
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: MLB_MODEL_DB_PATH
        value: /var/data/mlb_betting_model.sqlite
      - key: MLB_MODEL_HISTORY_DIR
        value: /var/data/history
      - key: PORT
        value: 10000
      - key: API_URL
        sync: false
      - key: DEPLOY_URL
        sync: false
    disk:
      name: mlb-betting-data
      mountPath: /var/data
      sizeGB: 1
